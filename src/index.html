<!doctype html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ki-oferta</title>
    <meta name="description" content="Aplicação de oferta comunitária">
    <meta name="keywords" content="promoção, ofertas, mercado, compras">
    <meta property="og:title" content="ki-oferta">
    <meta property="og:description" content="Page description">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.example.com">
    <meta property="og:image" content="https://www.example.com/image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ki-oferta">
    <meta name="twitter:description" content="Page description">
    <meta name="twitter:image" content="https://www.example.com/image.jpg">
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    

    <link rel="icon" type="image/x-icon" href="./assets/icon/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <meta name="theme-color" content="#31d53d" />
  </head>
  <body>
    <header id="navbar" class="navbar-bottom"></header>
    <main id="app">
      <header class="topo">
        <a class="logo" href="#">KiOferta</a>
        <a class="entrar" href="#">Entrar</a>
      </header>

      <section class="apresentacao">
        <p class="rotulo">RADAR DE PROMOÇÕES</p>

        <h1>Encontre ofertas perto de você</h1>

        <p class="descricao">
          Compare preços e veja se vale a pena ir até o mercado.
        </p>

        <form class="form-busca">
          <label for="busca-produto">Qual produto você procura?</label>

          <input
            id="busca-produto"
            class="campo-busca"
            type="search"
            placeholder="Exemplo: arroz, café ou leite"
          >

          <button class="botao-busca" type="submit">
            Buscar
          </button>
        </form>
      </section>

      <section class="categorias" aria-labelledby="titulo-categorias">
        <h2 id="titulo-categorias">Navegue por categoria</h2>

        <div class="lista-categorias">
          <a class="categoria" href="#">Arroz e feijão</a>
          <a class="categoria" href="#">Café</a>
          <a class="categoria" href="#">Laticínios</a>
          <a class="categoria" href="#">Bebidas</a>
          <a class="categoria" href="#">Higiene</a>
          <a class="categoria" href="#">Limpeza</a>
        </div>
      </section>

      <section class="aviso">
        <h2>Compare antes de sair</h2>

        <p>
          Uma oferta melhor depende de preço, distância e economia.
        </p>
      </section>
    </main>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
